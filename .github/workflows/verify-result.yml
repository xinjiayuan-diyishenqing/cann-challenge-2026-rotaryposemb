name: 校验脚本测试

on:
  push:
    paths:
      - 'scripts/verify_result.py'
      - 'tests/test_verify_result.py'
      - '.github/workflows/verify-result.yml'
  pull_request:
    paths:
      - 'scripts/verify_result.py'
      - 'tests/test_verify_result.py'
      - '.github/workflows/verify-result.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - run: python -m unittest discover -s tests -v
